name: Android CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ⬇️ 新增：从 Base64 还原签名文件
      - name: Restore keystore from Base64
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build with Gradle
        run: ./gradlew assembleFullRelease
        env:
          # ⬇️ 签名相关环境变量（通过 env 传递，Gradle 中通过 System.getenv() 读取）
          STORE_FILE: app/keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # ⬇️ 构建优化参数（通过 GRADLE_OPTS 传递）
          GRADLE_OPTS: "-Xmx8g -XX:+UseParallelGC -Xss1024m"

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aaps
          path: app/build/outputs/apk/full/release/
